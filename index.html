<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<meta name="description" content="Offline-capable expense tracker that works as an installable app.">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>💰 Expense Tracker</h1>
  <div class="head-actions">
    <button id="installBtn" hidden>Install App</button>
    <label class="visually-hidden" for="month">Month</label>
    <input type="month" id="month">
  </div>
</header>
<main>
  <section class="cards" aria-label="Summary">
    <div class="card income"><span>Income</span><strong id="sumIncome">0</strong></div>
    <div class="card expense"><span>Expenses</span><strong id="sumExpense">0</strong></div>
    <div class="card balance"><span>Balance</span><strong id="sumBalance">0</strong></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add Transaction</h2>
    <form id="form" novalidate>
      <div class="row">
        <div><label for="type">Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
        <div><label for="amount">Amount</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
      </div>
      <div class="row">
        <div><label for="category">Category</label><select id="category"></select></div>
        <div><label for="date">Date</label><input id="date" type="date" required></div>
      </div>
      <label for="note">Note (optional)</label>
      <input id="note" type="text" maxlength="80" placeholder="e.g. Lunch with friends">
      <p id="error" role="alert" class="error"></p>
      <div class="row">
        <button type="submit" id="saveBtn" class="primary">Add</button>
        <button type="button" id="cancelBtn" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Spending by Category</h2>
    <div id="breakdown"></div>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>Transactions</h2>
      <button id="exportBtn">Export CSV</button>
    </div>
    <ul id="list"></ul>
  </section>
</main>
<footer>Data is saved only on this device (offline, in your browser).</footer>
<script src="app.js"></script>
</body>
</html>
